---
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check
        if: runner.os != 'Windows'
        run: make ci
      - name: Check on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $unformatted = gofmt -l (git ls-files '*.go')
          if ($unformatted) { throw "Unformatted Go files: $unformatted" }
          go mod tidy -diff
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go build ./...
          exit $LASTEXITCODE
      - name: Race check
        if: runner.os == 'Linux'
        run: go test -race ./...

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Audit workflows
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          pipx run zizmor==1.30.1 --no-progress .github/workflows
      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Lint Go
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...
      - name: Read release version
        id: release-version
        run: echo "version=$(cat .goreleaser-version)" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ steps.release-version.outputs.version }}
          args: check

  check:
    if: always()
    needs: [test, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks
        env:
          TEST_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$TEST_RESULT" = success && test "$QUALITY_RESULT" = success
